<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#194f31" />
    <title>Sem conexão — Memória Concurseira</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #fafafa;
        color: #171717;
      }
      main { width: 100%; max-width: 380px; text-align: center; }
      /* O logotipo: um cartão claro com um cérebro verde e o "cartão de trás" do baralho. */
      .logo {
        width: 64px; height: 52px; margin: 0 auto 24px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        background: #f0faf3; box-shadow: 6px -6px 0 0 rgba(44, 143, 88, 0.6);
      }
      .logo svg { width: 32px; height: 32px; fill: none; stroke: #194f31; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 12px; color: #525252; line-height: 1.5; font-size: 15px; }
      ul { margin: 0 0 20px; padding: 0; list-style: none; text-align: left; color: #525252; font-size: 14px; }
      li { padding: 10px 14px; margin-bottom: 8px; border-radius: 10px; background: #fff; border: 1px solid #e5e5e5; }
      button {
        width: 100%; padding: 14px 16px; border: 0; border-radius: 10px;
        background: #237d48; color: #fff; font: inherit; font-weight: 600; font-size: 15px;
      }
      button:active { background: #1c633a; }
      .status { margin-top: 14px; font-size: 13px; color: #737373; min-height: 1.2em; }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #f5f5f5; }
        p, ul { color: #a3a3a3; }
        li { background: #171717; border-color: #262626; }
        .status { color: #8a8a8a; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
          <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
          <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4" />
          <path d="M17.599 6.5a3 3 0 0 0 .399-1.375" />
          <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5" />
          <path d="M3.477 10.896a4 4 0 0 1 .585-.396" />
          <path d="M19.938 10.5a4 4 0 0 1 .585.396" />
          <path d="M6 18a4 4 0 0 1-1.967-.516" />
          <path d="M19.967 17.484A4 4 0 0 1 18 18" />
        </svg>
      </div>
      <h1>Não consegui falar com o seu computador</h1>
      <p>O app roda no seu PC, então ele precisa estar acessível. Confira:</p>
      <ul>
        <li>O PC está ligado e fora do modo de suspensão?</li>
        <li>O Tailscale está ativo neste celular?</li>
      </ul>
      <button id="retry" type="button">Tentar de novo</button>
      <p class="status" id="status" role="status">Vou tentar sozinho a cada poucos segundos.</p>
    </main>
    <script>
      var status = document.getElementById('status');
      function check() {
        status.textContent = 'Tentando...';
        return fetch('/api/health', { cache: 'no-store' })
          .then(function (response) {
            // Servidor de volta: recarrega a tela que o usuário queria. Aberta direto (/offline.html), não há para onde voltar.
            if (response.ok) {
              if (location.pathname === '/offline.html') status.textContent = 'O computador respondeu.';
              else location.reload();
              return;
            }
            status.textContent = 'Ainda sem resposta. Vou tentar de novo.';
          })
          .catch(function () { status.textContent = 'Ainda sem resposta. Vou tentar de novo.'; });
      }
      document.getElementById('retry').addEventListener('click', check);
      window.addEventListener('online', check);
      setInterval(check, 8000);
    </script>
  </body>
</html>
